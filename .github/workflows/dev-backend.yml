name: Build and Push Backend Docker Image

on:
  push:
    branches:
      - main
      - task-43-agent-dev
    paths:
      - 'BackEnd/**'

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: Dev
    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{secrets.DOCKER_USERNAME}}/controlacr:BackEnd-dev ./BackEnd/

      # Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/controlacr:BackEnd-dev