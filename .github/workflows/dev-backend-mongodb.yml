name: Build and Push MongoDB Docker Image

on:
  push:
    branches:
      - main
      - task-43-agent-dev
    paths:
      - 'BackEnd/MongoDB/**'
      
permissions:
  id-token: write
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: Dev
    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{secrets.DOCKER_USERNAME}}/controlacr:mongodb-dev ./BackEnd/MongoDB/

      # Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/controlacr:mongodb-dev

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    environment: Dev
    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Azure Web App Container
        run: |
          az webapp config container set \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --docker-custom-image-name docker.io/${{ secrets.DOCKER_USERNAME }}/controlacr:mongodb-dev

      - name: Restart Azure Web App
        run: |
          az webapp restart \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}